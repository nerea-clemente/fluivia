<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Preparar demo · Fluivia</title>
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="theme-color" content="#123F35">
  <link rel="icon" href="../../favicon.ico" sizes="any">
  <link rel="icon" href="../../assets/img/favicon.svg" type="image/svg+xml">
  <style>
    @font-face { font-family: "Plus Jakarta Sans"; src: url("../../assets/fonts/PlusJakartaSans-Regular.woff2") format("woff2"); font-weight: 400; font-display: swap; }
    @font-face { font-family: "Plus Jakarta Sans"; src: url("../../assets/fonts/PlusJakartaSans-SemiBold.woff2") format("woff2"); font-weight: 600; font-display: swap; }
    @font-face { font-family: "Plus Jakarta Sans"; src: url("../../assets/fonts/PlusJakartaSans-Bold.woff2") format("woff2"); font-weight: 700; font-display: swap; }
    :root { --bosque: #123F35; --acento: #62D68B; --fondo: #F5F6F6; --texto: #18231F; --suave: #5B6662; --tenue: #87918D; --linea: #E4E8E6; --linea-2: #D3D9D6; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Plus Jakarta Sans", Arial, sans-serif; font-size: 15px; line-height: 1.55; color: var(--texto); background: var(--fondo); -webkit-font-smoothing: antialiased; }
    h1, h2, p { margin: 0; }
    :focus-visible { outline: 3px solid var(--acento); outline-offset: 2px; border-radius: 6px; }
    .topbar { display: flex; align-items: center; gap: 10px; height: 60px; padding: 0 24px; background: #fff; border-bottom: 1px solid var(--linea); }
    .topbar img { height: 26px; width: auto; }
    .pill { padding: 2px 9px; border-radius: 999px; background: var(--fondo); border: 1px solid var(--linea); color: var(--suave); font-size: 12px; font-weight: 600; }
    main { display: grid; grid-template-columns: 420px minmax(0, 1fr); gap: 28px; max-width: 1280px; margin: 0 auto; padding: 32px 24px 56px; }
    h1 { font-size: 26px; line-height: 1.2; letter-spacing: -.01em; }
    .intro { margin-top: 6px; color: var(--suave); }
    form { display: grid; gap: 16px; margin-top: 24px; padding: 22px; border-radius: 14px; background: #fff; border: 1px solid var(--linea); }
    label { display: grid; gap: 6px; font-size: 14px; font-weight: 600; }
    label small { font-weight: 400; color: var(--tenue); }
    input, select { width: 100%; min-height: 42px; padding: 0 12px; border: 1px solid var(--linea-2); border-radius: 10px; background: #fff; font: inherit; font-size: 15px; color: var(--texto); }
    input:focus, select:focus { outline: none; border-color: var(--bosque); box-shadow: 0 0 0 3px rgba(98, 214, 139, .35); }
    .color { display: grid; grid-template-columns: 52px 1fr; gap: 8px; }
    .color input[type="color"] { padding: 4px; cursor: pointer; }
    .resultado { margin-top: 16px; padding: 18px 22px; border-radius: 14px; background: #fff; border: 1px solid var(--linea); }
    .resultado p { font-size: 14px; font-weight: 600; }
    .enlace { margin: 8px 0 12px; padding: 10px 12px; border-radius: 10px; background: var(--fondo); font-size: 13px; word-break: break-all; color: var(--suave); }
    .acciones { display: flex; flex-wrap: wrap; gap: 8px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 40px; padding: 0 16px; border: 0; border-radius: 999px; background: var(--bosque); color: #fff; font: inherit; font-size: 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
    .btn-sec { background: #fff; color: var(--texto); box-shadow: inset 0 0 0 1px var(--linea-2); }
    .aviso { margin-top: 12px; font-size: 13px; color: var(--tenue); }
    .vista h2 { margin-bottom: 10px; font-size: 14px; color: var(--suave); }
    .vista iframe { display: block; width: 100%; height: 760px; border: 1px solid var(--linea); border-radius: 14px; background: #fff; }
    @media (max-width: 960px) {
      main { grid-template-columns: minmax(0, 1fr); }
      .vista iframe { height: 620px; }
    }
    @media (max-width: 640px) { main { padding: 24px 16px 44px; } .topbar { padding: 0 16px; } }
  </style>
</head>
<body>
  <header class="topbar">
    <img src="../../assets/img/logo.svg" alt="fluivia" width="650" height="225">
    <span class="pill">Preparar demo</span>
  </header>

  <main>
    <div>
      <h1>Demo con el nombre del cliente</h1>
      <p class="intro">Rellena sus datos y te da un enlace para la reunión o para mandarlo por correo. No se guarda nada: todo va dentro del enlace.</p>

      <form id="form" autocomplete="off">
        <label>Tipo de negocio
          <select id="s">
            <option value="clinica">Clínica de fisioterapia</option>
            <option value="gestoria">Gestoría</option>
            <option value="inmobiliaria">Inmobiliaria</option>
            <option value="academia">Academia</option>
            <option value="distribucion">Distribución</option>
            <option value="consultoria">Consultoría o agencia</option>
            <option value="comercio">Comercio</option>
            <option value="autoescuela">Autoescuela (solo en español)</option>
          </select>
        </label>
        <label>Idioma de la demo
          <select id="lang">
            <option value="es">Español</option>
            <option value="en">Inglés</option>
            <option value="da">Danés</option>
          </select>
        </label>
        <label>Nombre del negocio
          <input id="n" type="text" maxlength="60" placeholder="Fisioterapia Sur" required>
        </label>
        <label>Frase debajo del nombre <small>Opcional. Por ejemplo, su eslogan.</small>
          <input id="lema" type="text" maxlength="90" placeholder="Fisioterapia deportiva en Sevilla">
        </label>
        <label>Color principal de su marca
          <span class="color">
            <input id="cpick" type="color" value="#0F7C7E" aria-label="Elegir color">
            <input id="c" type="text" value="#0F7C7E" maxlength="7" aria-label="Código del color">
          </span>
        </label>
        <label>Logo <small>Opcional. Dirección de la imagen de su logo (empieza por https). Si no carga, salen sus iniciales.</small>
          <input id="l" type="url" placeholder="https://www.sunegocio.es/logo.png">
        </label>
        <label>Tu correo <small>Para que el cliente te mande lo que ha elegido al final de la demo. Se recuerda en este navegador.</small>
          <input id="r" type="email" placeholder="tu@correo.es">
        </label>
      </form>

      <div class="resultado">
        <p>Enlace de la demo</p>
        <div class="enlace" id="enlace">Escribe el nombre del negocio.</div>
        <div class="acciones">
          <button type="button" class="btn" id="copiar">Copiar enlace</button>
          <a class="btn btn-sec" id="abrir" href="./" target="_blank" rel="noopener">Abrir</a>
        </div>
        <p class="aviso" id="estado" role="status" aria-live="polite"></p>
      </div>
    </div>

    <section class="vista">
      <h2>Así la verá</h2>
      <iframe id="vista" title="Vista previa de la demo" src="./"></iframe>
    </section>
  </main>

  <script>
    (function () {
      "use strict";
      var $ = function (id) { return document.getElementById(id); };
      var campos = ["s", "lang", "n", "lema", "c", "l", "r"];
      var temporizador;

      try { var guardado = localStorage.getItem("fluivia-demo-correo"); if (guardado) $("r").value = guardado; } catch (e) {}

      function enlace() {
        var base = new URL("./", location.href);
        var p = new URLSearchParams();
        p.set("s", $("s").value);
        if ($("lang").value !== "es") p.set("lang", $("lang").value);
        var n = $("n").value.trim();
        if (n) p.set("n", n);
        var lema = $("lema").value.trim();
        if (lema) p.set("lema", lema);
        var c = $("c").value.trim().replace("#", "");
        if (/^[0-9a-f]{6}$/i.test(c)) p.set("c", c.toUpperCase());
        var l = $("l").value.trim();
        if (/^https:\/\//i.test(l)) p.set("l", l);
        var r = $("r").value.trim();
        if (r && $("r").checkValidity()) p.set("r", r);
        return base.href + "?" + p.toString();
      }

      function actualizar() {
        var url = enlace();
        var listo = !!$("n").value.trim();
        $("enlace").textContent = listo ? url : "Escribe el nombre del negocio.";
        $("abrir").href = url;
        $("estado").textContent = "";
        clearTimeout(temporizador);
        temporizador = setTimeout(function () { $("vista").src = url; }, 400);
        try { if ($("r").value.trim() && $("r").checkValidity()) localStorage.setItem("fluivia-demo-correo", $("r").value.trim()); } catch (e) {}
      }

      $("cpick").addEventListener("input", function () { $("c").value = this.value.toUpperCase(); actualizar(); });
      $("c").addEventListener("input", function () {
        var v = this.value.trim();
        if (/^#?[0-9a-f]{6}$/i.test(v)) $("cpick").value = (v.charAt(0) === "#" ? v : "#" + v);
      });
      campos.forEach(function (id) { $(id).addEventListener("input", actualizar); });
      $("s").addEventListener("change", actualizar);
      $("form").addEventListener("submit", function (e) { e.preventDefault(); });

      $("copiar").addEventListener("click", function () {
        if (!$("n").value.trim()) { $("estado").textContent = "Falta el nombre del negocio."; $("n").focus(); return; }
        var url = enlace();
        var hecho = function () { $("estado").textContent = "Enlace copiado."; };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(url).then(hecho, function () { $("estado").textContent = "No se ha podido copiar. Selecciona el enlace y cópialo a mano."; });
        } else {
          $("estado").textContent = "Selecciona el enlace y cópialo a mano.";
        }
      });

      actualizar();
    })();
  </script>
</body>
</html>
