  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="theme-color" content="#123F35">
  <link rel="icon" href="../../favicon.ico" sizes="any">
  <link rel="icon" href="../../assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="../../assets/fonts/PlusJakartaSans-Bold.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="../../assets/fonts/PlusJakartaSans-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>
  <header class="topbar">
    <a class="topbar-brand" href="#inicio" aria-label="Inicio de la demo">
      <img src="../../assets/img/logo.svg" alt="fluivia" width="650" height="225">
      <span class="demo-pill">Demo</span>
    </a>
    <span class="demo-para" id="demo-para" hidden></span>
    <label class="sector-picker">
      <span>Ejemplo de</span>
      <select id="sector" aria-label="Tipo de negocio del ejemplo"></select>
    </label>
    <button class="menu-btn" type="button" aria-expanded="false" aria-controls="nav">
      <span class="sr-only">Menú de la demo</span><span class="menu-bar" aria-hidden="true"></span>
    </button>
  </header>

  <div class="layout">
    <nav class="nav" id="nav" aria-label="Partes de la demo"></nav>
    <main class="view" id="view" tabindex="-1"></main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="sectores/gestoria.js?v=2"></script>
  <script src="sectores/inmobiliaria.js?v=2"></script>
